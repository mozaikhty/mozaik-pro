<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanıcı Profili / Mozaik</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
    <!-- TAILWIND CSS & DARK MODE AYARI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '.dark-mode'], // Sistemindeki .dark-mode sınıfını dinler!
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=31">
    
    <style>
        ::-webkit-scrollbar { display: none; }
        
        /* Eski Tasarımın Kalıntılarını Gizle */
        /* .mobile-sidebar, .mobile-sidebar-overlay, .app-container { display: none !important; } */
        
        /* ÖZEL MOZAİK GRID (Asimetrik Görünüm) */
        .mosaic-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 120px;
            gap: 4px;
            padding: 4px;
        }
        
        .mosaic-item { position: relative; overflow: hidden; border-radius: 8px; cursor: pointer; transition: transform 0.2s, filter 0.2s; }
        .mosaic-item:hover { transform: scale(0.98); filter: brightness(0.9); }
        .mosaic-item img, .mosaic-item video { width: 100%; height: 100%; object-fit: cover; }

        .mosaic-item:nth-child(5n) { grid-row: span 2; grid-column: span 2; border-radius: 12px; }
        .mosaic-item:nth-child(7n) { grid-row: span 2; border-radius: 10px; }
        
        .mosaic-item:nth-child(odd) { clip-path: polygon(2% 0, 100% 2%, 98% 100%, 0 98%); }
        .mosaic-item:nth-child(even) { clip-path: polygon(0 2%, 98% 0, 100% 98%, 2% 100%); }

        .action-scroll::-webkit-scrollbar { display: none; }
        .action-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans min-h-screen pb-20 text-slate-800 dark:text-gray-200">
    <script>
        try {
            if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        } catch(e) { console.warn("Gizli mod nedeniyle tema okunamadı."); }
    </script>

    <!-- Arka plan rengini style.css devralır, biz sadece içeriği kodlarız -->
    <main class="max-w-xl mx-auto min-h-screen flex flex-col">
        
        <!-- HEADER -->
        <header class="flex justify-between items-center px-5 py-4 sticky top-0 bg-white/90 dark:bg-[#0b1121]/90 backdrop-blur-md z-40 border-b border-slate-200 dark:border-gray-800">
            <div class="flex items-center space-x-1 text-2xl font-bold text-slate-900 dark:text-white tracking-wide cursor-pointer" onclick="window.history.back()">
                <img src="icon-192.png" alt="Mozaik Logo" class="h-10 w-auto object-contain">
            </div>
            <div class="flex space-x-4 text-xl text-slate-600 dark:text-gray-300">
                <i class="fa-regular fa-square-plus cursor-pointer hover:text-cyan-500 dark:hover:text-white transition" onclick="window.location.href='feed.html?action=post'"></i>
                <i class="fa-solid fa-bars cursor-pointer hover:text-cyan-500 dark:hover:text-white transition" onclick="window.openSettingsModal()"></i>
            </div>
        </header>

        <!-- PROFİL BİLGİLERİ -->
        <div class="px-5 pt-4 flex items-center gap-5">
            <div class="relative w-24 h-24 flex-shrink-0">
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-cyan-400 via-purple-500 to-pink-500 animate-spin-slow" style="padding: 2px;">
                    <div id="profile-avatar" class="w-full h-full rounded-full bg-white dark:bg-gray-800 overflow-hidden border-2 border-white dark:border-[#0b1121] flex justify-center items-center text-3xl shadow-sm">
                        👤
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-hidden">
                <h1 id="display-fullname" class="text-xl font-bold text-slate-900 dark:text-white flex items-center gap-1">Yükleniyor...</h1>
                <p id="display-username" class="text-sm text-slate-500 dark:text-gray-400">@bekleniyor</p>
                <p id="display-bio" class="text-sm text-slate-700 dark:text-gray-200 mt-2 line-clamp-2">Biyografi yükleniyor...</p>
                <div id="display-details" class="text-xs text-slate-500 dark:text-gray-400 mt-1 flex gap-2"></div>
                <div id="private-badge-container" class="mt-1"></div>
            </div>
        </div>

        <!-- İSTATİSTİKLER -->
        <div class="flex justify-around items-center px-4 py-6 border-b border-slate-200 dark:border-gray-800 mt-2">
            <div class="text-center cursor-pointer">
                <div class="font-bold text-lg text-slate-900 dark:text-white" id="header-post-count">0</div>
                <div class="text-xs text-slate-500 dark:text-gray-400">Mozaik</div>
            </div>
            <div class="text-center cursor-pointer hover:bg-slate-100 dark:hover:bg-gray-800/50 p-2 rounded-xl transition" id="followers-box">
                <div class="font-bold text-lg text-slate-900 dark:text-white" id="followers-count">0</div>
                <div class="text-xs text-slate-500 dark:text-gray-400">Takipçi</div>
            </div>
            <div class="text-center cursor-pointer hover:bg-slate-100 dark:hover:bg-gray-800/50 p-2 rounded-xl transition" id="following-box">
                <div class="font-bold text-lg text-slate-900 dark:text-white" id="following-count">0</div>
                <div class="text-xs text-slate-500 dark:text-gray-400">Takip Edilen</div>
            </div>
        </div>

        <!-- PROFİL BUTONLARI -->
        <div id="action-buttons-container" class="px-5 py-4 flex gap-3 justify-center">
            <!-- JS Tarafından doldurulacak -->
        </div>

        <!-- KATEGORİ BUTONLARI -->
        <div class="flex overflow-x-auto gap-4 px-5 py-2 action-scroll">
            <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0 group" onclick="window.location.href='feed.html?action=post'">
                <div class="w-12 h-12 rounded-2xl bg-blue-50 dark:bg-blue-900/30 text-blue-500 dark:text-blue-400 flex justify-center items-center text-xl border border-blue-100 dark:border-blue-900/50 group-hover:bg-blue-100 transition"><i class="fa-regular fa-image"></i></div>
                <span class="text-[10px] text-slate-500 dark:text-gray-400 font-medium">Fotoğraf</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0 group" onclick="window.location.href='feed.html?action=post'">
                <div class="w-12 h-12 rounded-2xl bg-purple-50 dark:bg-purple-900/30 text-purple-500 dark:text-purple-400 flex justify-center items-center text-xl border border-purple-100 dark:border-purple-900/50 group-hover:bg-purple-100 transition"><i class="fa-solid fa-video"></i></div>
                <span class="text-[10px] text-slate-500 dark:text-gray-400 font-medium">Video</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0 group">
                <div class="w-12 h-12 rounded-2xl bg-pink-50 dark:bg-pink-900/30 text-pink-500 dark:text-pink-400 flex justify-center items-center text-xl border border-pink-100 dark:border-pink-900/50 group-hover:bg-pink-100 transition"><i class="fa-solid fa-music"></i></div>
                <span class="text-[10px] text-slate-500 dark:text-gray-400 font-medium">Müzik</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0 group" onclick="window.location.href='feed.html?action=post'">
                <div class="w-12 h-12 rounded-2xl bg-orange-50 dark:bg-orange-900/30 text-orange-500 dark:text-orange-400 flex justify-center items-center text-xl border border-orange-100 dark:border-orange-900/50 group-hover:bg-orange-100 transition"><i class="fa-regular fa-file-lines"></i></div>
                <span class="text-[10px] text-slate-500 dark:text-gray-400 font-medium">Yazı</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0 group">
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-900/30 text-emerald-500 dark:text-emerald-400 flex justify-center items-center text-xl border border-emerald-100 dark:border-emerald-900/50 group-hover:bg-emerald-100 transition"><i class="fa-solid fa-chart-simple"></i></div>
                <span class="text-[10px] text-slate-500 dark:text-gray-400 font-medium">Anket</span>
            </div>
            <div class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0 group">
                <div class="w-12 h-12 rounded-2xl bg-cyan-50 dark:bg-cyan-900/30 text-cyan-500 dark:text-cyan-400 flex justify-center items-center text-xl border border-cyan-100 dark:border-cyan-900/50 group-hover:bg-cyan-100 transition"><i class="fa-solid fa-location-dot"></i></div>
                <span class="text-[10px] text-slate-500 dark:text-gray-400 font-medium">Konum</span>
            </div>
        </div>

        <!-- MOZAİK POST GRID -->
        <div id="profile-feed-container" class="mosaic-grid mt-4">
            <div style="padding:40px; text-align:center; grid-column: 1 / -1;" class="text-slate-500 dark:text-gray-400">Yükleniyor...</div>
        </div>

    </main>

    <!-- MOBİL ALT NAVİGASYON (Aydınlık/Karanlık Uyumlu) -->
    <div class="fixed bottom-0 w-full backdrop-blur-md border-t border-slate-200 dark:border-gray-800 lg:hidden bg-white/95 dark:bg-[#0b1121]/95" style="z-index: 50;">
        <div class="flex justify-around items-center h-16 relative">
            <a href="feed.html" class="flex flex-col items-center text-slate-400 dark:text-gray-400 hover:text-cyan-500 dark:hover:text-white transition"><i class="fa-solid fa-house text-lg"></i></a>
            <a href="search.html" class="flex flex-col items-center text-slate-400 dark:text-gray-400 hover:text-cyan-500 dark:hover:text-white transition"><i class="fa-solid fa-magnifying-glass text-lg"></i></a>
            
            <div class="relative -top-5">
                <div class="w-14 h-14 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30 cursor-pointer transform rotate-45 hover:scale-105 transition bg-gradient-to-tr from-cyan-400 to-blue-500" onclick="window.location.href='feed.html?action=post'">
                    <i class="fa-solid fa-plus text-white text-2xl -rotate-45"></i>
                </div>
            </div>
            
            <a href="notifications.html" class="flex flex-col items-center text-slate-400 dark:text-gray-400 hover:text-cyan-500 dark:hover:text-white transition"><i class="fa-regular fa-bell text-lg"></i></a>
            <a href="#" onclick="window.goToMyProfile()" class="flex flex-col items-center text-cyan-500 dark:text-white"><i class="fa-regular fa-user text-lg"></i></a>
        </div>
    </div>

    <!-- Modallar (Gece moduna göre renkleri güncellendi) -->
    <div class="modal-overlay" id="post-detail-modal">
        <div class="modal-content bg-white dark:bg-[#151e32] text-slate-800 dark:text-white border border-slate-200 dark:border-gray-700" id="post-detail-content-box">
            <div class="modal-header bg-white dark:bg-[#151e32] border-slate-200 dark:border-gray-700">
                <h3 style="margin:0; font-size:18px;">Gönderi Detayı</h3>
                <button class="close-btn text-slate-600 dark:text-gray-400 hover:bg-slate-100 dark:hover:bg-gray-800" onclick="window.closePostDetail()">&times;</button>
            </div>
            <div id="post-detail-container" style="padding-bottom: 20px;"></div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content bg-white dark:bg-[#151e32] text-slate-800 dark:text-white border border-slate-200 dark:border-gray-700">
            <div class="modal-header bg-white dark:bg-[#151e32] border-slate-200 dark:border-gray-700">
                <h3 style="margin:0; font-size:16px;">Profili Düzenle</h3>
                <button class="close-btn" id="cancel-edit-btn" style="background:transparent;">&times;</button>
            </div>
            <div style="margin-bottom:15px; padding:15px; border-radius:8px;" class="bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700">
                <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size:14px; font-weight:600;" class="text-slate-700 dark:text-gray-300"><input type="checkbox" id="edit-private-input" class="accent-cyan-500"> 🔒 Hesabımı Gizle</label>
            </div>
            <div style="font-size:13px; font-weight:600; margin-bottom:5px;" class="text-slate-500 dark:text-gray-400">Profil Fotoğrafı (Avatar)</div>
            <input type="file" id="edit-avatar-input" class="modal-input bg-white dark:bg-gray-800 border-slate-300 dark:border-gray-700 text-slate-800 dark:text-white" accept="image/*">
            <input type="text" id="edit-fullname-input" class="modal-input bg-white dark:bg-gray-800 border-slate-300 dark:border-gray-700 text-slate-800 dark:text-white" placeholder="İsim">
            <textarea id="edit-bio-input" class="modal-input bg-white dark:bg-gray-800 border-slate-300 dark:border-gray-700 text-slate-800 dark:text-white" rows="3" placeholder="Kısa özgeçmiş" style="resize:none;"></textarea>
            
            <div style="text-align:right; margin-top:10px;">
                <button class="modal-btn-save shadow-md" id="save-edit-btn" style="background:#06b6d4; color:white;">Güncelle</button>
            </div>
            <div style="text-align:center; margin-top:20px; padding-top:20px; border-top:1px solid;" class="border-slate-200 dark:border-gray-700">
                <button id="trigger-delete-account-btn" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:600; font-size:14px;">Hesabımı Kalıcı Olarak Sil</button>
            </div>
        </div>
    </div>

    <!-- WebRTC Modalları vs. -->
    <div class="call-overlay" id="call-overlay"><h2 class="call-status-text" id="call-status-text">Aranıyor...</h2><div class="video-container" id="video-container"><video id="remote-video" class="remote-video" autoplay playsinline></video><video id="local-video" class="local-video" autoplay playsinline muted></video></div><div class="call-controls"><button class="call-action-btn btn-accept" id="accept-call-btn">📞</button><button class="call-action-btn btn-end" id="end-call-btn">📵</button></div></div>
    <div class="modal-overlay" id="users-list-modal"><div class="modal-content bg-white dark:bg-[#151e32]" style="padding:0;"><div class="modal-header border-slate-200 dark:border-gray-700 bg-white dark:bg-[#151e32]" style="padding: 20px; margin:0;"><h3 id="users-list-title" style="margin:0; font-size:16px;">Liste</h3><button class="close-btn" id="close-list-btn" style="background:transparent;">&times;</button></div><div id="users-list-container" style="max-height:400px; overflow-y:auto; padding: 10px;"></div></div></div>
    <div class="modal-overlay" id="share-dm-modal"><div class="modal-content bg-white dark:bg-[#151e32]" style="padding:0;"><div class="modal-header border-slate-200 dark:border-gray-700 bg-white dark:bg-[#151e32]" style="padding: 20px; margin:0;"><h3 style="margin:0; font-size:16px;">Direkt Mesaj ile İlet</h3><button class="close-btn" onclick="document.getElementById('share-dm-modal').style.display='none'" style="background:transparent;">&times;</button></div><div id="share-users-list" style="max-height:300px; overflow-y:auto; padding: 10px;"></div></div></div>

    <script type="module" src="app.js?v=7"></script>
    <script type="module" src="profile.js?v=7"></script>
    <script type="module" src="webrtc.js?v=7"></script>
    <script src="ui.js?v=29"></script>
</body>
</html>

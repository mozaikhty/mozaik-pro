<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mozaik - Yeni Şifre Belirle</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0 0 30px 0;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: inherit;
        }

        input:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .submit-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .submit-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .msg {
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            background: #fef2f2;
            color: var(--error);
            border: 1px solid #fca5a5;
        }

        .success-msg {
            background: #f0fdf4;
            color: var(--success);
            border: 1px solid #86efac;
        }

        .password-wrapper { position: relative; }
        .toggle-password {
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #94a3b8; cursor: pointer;
            padding: 0; font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
        .toggle-password:hover { color: var(--text-main); }

    </style>
</head>
<body>
    <div class="auth-card">
        <img src="icon-512.png" alt="Mozaik Logo" class="logo">
        <h1 class="title">Yeni Şifre Belirle</h1>
        <p class="subtitle" id="reset-subtitle">Hesabınız için güçlü ve yeni bir şifre oluşturun.</p>

        <div id="error-message" class="msg error-msg"></div>
        <div id="success-message" class="msg success-msg"></div>

        <div id="reset-form" style="display: none;">
            <div class="input-group">
                <label class="input-label">Yeni Şifre (En az 6 hane)</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" placeholder="Yeni şifreniz" required>
                    <button type="button" class="toggle-password" onclick="togglePass('new-password', this)">👁️</button>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Şifreyi Tekrar Girin</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password-confirm" placeholder="Şifrenizi doğrulayın" required>
                    <button type="button" class="toggle-password" onclick="togglePass('new-password-confirm', this)">👁️</button>
                </div>
            </div>

            <button id="reset-btn" class="submit-btn">Şifremi Güncelle</button>
        </div>
        
        <div id="loading-spinner" style="padding: 20px; font-weight: 600; color: #64748b;">Bağlantı doğrulanıyor...</div>
        
        <a href="index.html" class="back-link">← Giriş ekranına dön</a>
    </div>

    <script>
        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '🙈';
            } else {
                input.type = 'password';
                btn.innerHTML = '👁️';
            }
        }
    </script>
    <script type="module" src="reset-password.js?v=29"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Keşfet / Mozaik</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="style.css?v=29">
</head>
<body>
    <script>
        try {
            if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        } catch(e) { console.warn("Gizli mod veya erişim engeli nedeniyle tema okunamadı."); }
    </script>

    <div class="mobile-sidebar-overlay" id="mobile-sidebar-overlay" onclick="window.closeMobileSidebar()"></div>
    <div class="mobile-sidebar" id="mobile-sidebar">
        <div class="sidebar-header-mobile">
            <div class="sidebar-top-icons">
                <div class="sidebar-avatar-mobile" id="sidebar-avatar-mobile" onclick="window.goToMyProfile()">👤</div>
                <div class="sidebar-extra-icons">
                    <div class="s-icon-btn" title="Başka hesap ekle">+</div>
                </div>
            </div>
            <div class="sidebar-name-mobile" id="sidebar-name-mobile">Yükleniyor...</div>
            <div class="sidebar-handle-mobile" id="sidebar-handle-mobile">@bekleniyor</div>
            <div class="sidebar-stats-mobile">
                <div onclick="window.showMyFollowing()" style="cursor:pointer;"><b id="sidebar-following-count">0</b> Ağım</div>
                <div onclick="window.showMyFollowers()" style="cursor:pointer;"><b id="sidebar-followers-count">0</b> Takipçiler</div>
            </div>
        </div>
        <div class="sidebar-menu-mobile">
            <a href="#" class="sidebar-menu-item" id="sidebar-profile-link" onclick="window.goToMyProfile()">👤 Profil</a>
            <a href="feed.html?tab=bookmarks" class="sidebar-menu-item">🔖 Koleksiyonum</a>
            <div class="sidebar-divider"></div>
            <div class="sidebar-bottom-menu">
                <a href="#" class="sidebar-bottom-item" onclick="window.openSettingsModal()">⚙️ Ayarlar ve Görünüm</a>
                <a href="#" class="sidebar-bottom-item" style="color: #ef4444; margin-top: 10px;" onclick="window.logoutUser()">🚪 Çıkış Yap</a>
            </div>
        </div>
    </div>

    <div class="app-container">
        <div id="sidebar-container"></div>

        <main class="feed-main" style="max-width: 750px; width: 100%;">
            <div class="header-sticky" style="background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);">
                <div class="mobile-header-top" style="display: flex; padding: 10px 0; align-items: center; justify-content: space-between;">
                    <div id="mobile-avatar-header" style="width:36px; height:36px; border-radius:8px; background:#e2e8f0; overflow:hidden; cursor:pointer; display: flex; justify-content: center; align-items: center; font-size: 20px;" onclick="window.openMobileSidebar()">👤</div>
                    <div class="mobile-logo-text" style="font-size: 20px; font-weight: 900; color: #2c3e50;">Keşfet</div>
                    <div style="width:36px;"></div>
                </div>
                
                <div class="search-header-box" style="padding: 15px 0; position:relative; max-width: 700px; margin: 0 auto; width: 100%;">
                    <div style="position:relative;">
                        <span style="position:absolute; left:18px; top:50%; transform:translateY(-50%); font-size:18px; color:#94a3b8;">🔍</span>
                        <input type="text" id="smart-search-input" class="search-input" placeholder="Kişi, konu veya etiket ara..." style="width: 100%; padding: 14px 20px 14px 45px; border-radius: 100px; border: 1px solid rgba(226, 232, 240, 0.8); font-size: 15px; outline: none; background: rgba(255,255,255,0.9); box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: 0.2s;" autocomplete="off">
                    </div>
                    <div id="search-suggestions" style="display:none; position:absolute; top:calc(100% - 5px); left:0; width:100%; background:rgba(255,255,255,0.98); backdrop-filter:blur(15px); border:1px solid #cbd5e1; border-radius:16px; box-shadow:0 15px 35px rgba(0,0,0,0.1); z-index:100; max-height:400px; overflow-y:auto; padding:10px 0;"></div>
                </div>
                
                <div class="category-pills-wrapper" style="position:relative; max-width:700px; margin:0 auto; padding-bottom: 15px; display: flex; align-items: center; gap: 10px; width: 100%;">
                    <div class="category-pill active" id="fixed-all-btn" onclick="window.setCategory('all')" style="flex-shrink: 0; z-index: 10;">Tümü</div>
                    <div style="flex: 1; display: flex; align-items: center; min-width: 0; position: relative;">
                        <button id="pill-scroll-left" class="pill-scroll-btn" style="display:none;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <div id="category-pills-container" class="category-pills-container">
                            <!-- Categories will be injected here -->
                        </div>
                        <button id="pill-scroll-right" class="pill-scroll-btn" style="display:none;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <div id="explore-results" class="explore-results-container" style="padding-top: 15px; max-width:750px; margin:0 auto;"></div>
            <div id="loading-indicator" style="text-align:center; padding:20px; display:none; color:#64748b;">Yükleniyor...</div>
        </main>

        <aside class="sidebar-right">
            <div class="who-to-follow">
                <div class="wtf-title">Gündem ve Öneriler</div>
                <div id="who-to-follow-list">
                    <div style="font-size:14px; color:#64748b;">Öneriler yükleniyor...</div>
                </div>
            </div>
            <div style="font-size: 12px; color: #94a3b8; margin-top: 20px; text-align:center;">
                © 2026 Mozaik Platform
            </div>
        </aside>
    </div>

    <!-- POST DETAIL MODAL (Explore Sayfasında Gerekli) -->
    <div id="post-detail-modal" class="modal-overlay" style="display:none;" onclick="if(event.target === this) window.closePostDetail()">
        <div class="modal-content" style="max-width: 650px; width: 95%; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; padding:0;">
            <div class="modal-header" style="position: sticky; top:0; z-index: 10;">
                <h3 style="margin: 0;">Gönderi</h3>
                <span class="close-modal" onclick="window.closePostDetail()">&times;</span>
            </div>
            <div id="post-detail-container" style="overflow-y:auto; flex:1;"></div>
        </div>
    </div>

    <div id="bottom-nav-container"></div>
    
    <script src="ui.js?v=29"></script>
    <script type="module" src="search.js"></script>

    <!-- Webrtc Call Overlay -->
    <div id="call-overlay" class="call-overlay">
        <div id="call-status-text" style="font-size: 20px; font-weight: 600; margin-bottom: 20px;">Aranıyor...</div>
        <div style="display:flex; gap:30px;">
            <button id="end-call-btn" class="call-action-btn" style="background:#ef4444;" onclick="window.endCall()">📞</button>
            <button id="accept-call-btn" class="call-action-btn" style="background:#22c55e; display:none;" onclick="window.acceptCall()">🎥</button>
        </div>
    </div>
    <script type="module" src="webrtc.js"></script>
</body>
</html>

<div class="modal-overlay" id="story-details-modal" style="z-index: 5020;">
        <div class="modal-content" style="padding:0;">
            <div class="modal-header" style="padding: 20px; margin:0;">
                <h3 style="margin:0; font-size:16px;">Hikaye Detayları</h3>
                <button class="close-btn" onclick="window.closeStoryDetailsModal()">&times;</button>
            </div>
            <div class="feed-tabs" style="margin:0; box-shadow:none; border-radius:0; border-left:none; border-right:none;">
                <div class="feed-tab active" id="tab-story-views" onclick="window.switchStoryDetailsTab('views')">Görüntüleyenler</div>
                <div class="feed-tab" id="tab-story-likes" onclick="window.switchStoryDetailsTab('likes')">Beğenenler</div>
            </div>
            <div id="story-details-list" style="max-height:300px; overflow-y:auto; padding: 10px;"></div>
            <div style="padding: 15px; border-top: 1px solid #e2e8f0; text-align: center;">
                <button onclick="window.deleteCurrentStory()" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer; width:100%;">🗑️ Hikayeyi Sil</button>
            </div>
        </div>
    </div>

<div class="modal-overlay" id="story-share-modal" style="z-index: 5020;">
        <div class="modal-content" style="padding:0;">
            <div class="modal-header" style="padding: 20px; margin:0;">
                <h3 style="margin:0; font-size:16px;">Hikayeyi İlet</h3>
                <button class="close-btn" onclick="window.closeStoryShareModal()">&times;</button>
            </div>
            <div id="story-share-list" style="max-height:300px; overflow-y:auto; padding: 10px;"></div>
        </div>
    </div>

<div class="modal-overlay" id="add-story-modal" style="z-index: 5020;">
        <div class="modal-content" style="max-width: 400px; width:90%; padding:15px;">
            <div class="modal-header" style="padding-bottom:10px; border-bottom:1px solid #f1f5f9; margin-bottom:15px;">
                <h3 style="margin:0; font-size:16px;">Durumunu Paylaş</h3>
                <button class="close-btn" onclick="document.getElementById('add-story-modal').style.display='none'">&times;</button>
            </div>
            
            <div class="story-editor-board" id="story-editor-board">
                <img id="editor-image-preview" class="draggable-img" src="">
                <video id="editor-video-preview" class="draggable-img" src="" style="display: none;" playsinline loop muted></video>
                <div id="editor-text-preview" class="draggable-text"></div>
            </div>

            <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:15px;">
                <textarea id="story-text-input" style="width:100%; border:1px solid #cbd5e1; padding:10px; border-radius:8px; resize:none; font-family:inherit; outline:none; font-size:15px;" placeholder="Hikayene bir şeyler yaz... Sürükleyebilirsin." oninput="window.updateEditorText(this.value)"></textarea>
                
                <div style="display:flex; justify-content:space-between; align-items:center; gap: 5px;">
                    <button id="story-text-bg-btn" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:5px 10px; border-radius:6px; cursor:pointer;" title="Arka Plan" onclick="window.toggleTextBackground()">A</button>
                    <button id="story-text-bold-btn" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:5px 10px; border-radius:6px; cursor:pointer; font-weight:bold;" onclick="window.toggleTextBold()">B</button>
                    <div id="story-color-palette" style="display:flex; gap:5px; overflow-x:auto; padding:2px;">
                        <div class="color-swatch" style="background:white; border:1px solid #ccc; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="window.changeTextColor('white')"></div>
                        <div class="color-swatch" style="background:black; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="window.changeTextColor('black')"></div>
                        <div class="color-swatch" style="background:#ef4444; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="window.changeTextColor('#ef4444')"></div>
                        <div class="color-swatch" style="background:#3b82f6; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="window.changeTextColor('#3b82f6')"></div>
                        <div class="color-swatch" style="background:#22c55e; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="window.changeTextColor('#22c55e')"></div>
                        <div class="color-swatch" style="background:#eab308; width:20px; height:20px; border-radius:50%; cursor:pointer;" onclick="window.changeTextColor('#eab308')"></div>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                    <input type="file" id="story-image-input" accept="image/*,video/mp4,video/webm" style="display:none;" onchange="window.loadEditorImage(event)">
                    <label for="story-image-input" style="flex:1; text-align:center; background:#f1f5f9; border:1px solid #cbd5e1; padding:8px 5px; border-radius:8px; font-weight:600; cursor:pointer; font-size:13px; color:#334155;">🖼️ Seç</label>
                    <button id="story-camera-btn" style="flex:1; background:#f1f5f9; border:1px solid #cbd5e1; padding:8px 5px; border-radius:8px; font-weight:600; cursor:pointer; font-size:13px; color:#334155;" onclick="window.openStoryCamera()">📸 Çek</button>
                    <select id="story-privacy-select" style="flex:2; background:#f1f5f9; border:1px solid #cbd5e1; padding:8px 5px; border-radius:8px; font-weight:600; font-size:13px; outline:none;">
                        <option value="public">🌍 Herkes</option>
                        <option value="followers">👥 Takipçiler</option>
                        <option value="close_friends">💚 Yakın Arkadaşlar</option>
                    </select>
                </div>
                
                <div id="story-camera-container" style="display:none; position:relative; width:100%; aspect-ratio:9/16; background:#000; border-radius:8px; overflow:hidden;">
                    <video id="story-camera-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
                    <button id="story-capture-btn" style="position:absolute; bottom:15px; left:50%; transform:translateX(-50%); width:50px; height:50px; border-radius:50%; background:white; border:4px solid #cbd5e1; cursor:pointer;" onclick="window.captureStoryPhoto()"></button>
                    <button style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.5); border:none; color:white; font-size:20px; border-radius:50%; width:30px; height:30px; cursor:pointer;" onclick="window.closeStoryCamera()">&times;</button>
                </div>

                <div class="slider-group">
                    <label>Medya Büyüklüğü</label>
                    <input type="range" id="img-scale-slider" min="0.5" max="3" step="0.1" value="1" disabled oninput="window.updateScale('image', this.value)">
                </div>
                <div class="slider-group">
                    <label>Yazı Büyüklüğü</label>
                    <input type="range" id="text-scale-slider" min="0.5" max="3" step="0.1" value="1" disabled oninput="window.updateScale('text', this.value)">
                </div>
            </div>

            <button id="submit-story-btn" style="width:100%; background:#2c3e50; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:15px; transition:0.2s;" onmouseover="this.style.background='#1a252f'" onmouseout="this.style.background='#2c3e50'">Hikayemi Yayınla</button>
        </div>
    </div>

<div id="main-post-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 600px; width:90%;">
            <div class="modal-header" style="border-bottom:none; margin-bottom:0;">
                <button class="close-btn" onclick="window.closeMainPostModal()">&times;</button>
                
            </div>
            <div class="input-form" style="display:flex; gap:15px; margin-top:10px;">
                <div class="input-avatar" id="modal-avatar">👤</div>
                <div style="flex:1;">
                    <textarea id="modal-post-text" maxlength="1000" placeholder="Düşüncelerinizi aktarın..." style="width:100%; border:none; font-size:18px; outline:none; resize:none; min-height:120px; font-family:inherit; color:#0f172a; background:transparent;"></textarea>
                    <input type="file" id="modal-image-input" accept="image/*,video/mp4,video/webm" multiple style="display: none;">
                    <div id="modal-image-preview-text" style="display:none; color:#2c3e50; font-size:13px; font-weight:bold; margin-bottom:10px;">✓ Fotoğraf Eklendi</div>
                    <div id="modal-location-preview-text" style="display:none; color:#2c3e50; font-size:13px; font-weight:bold; margin-bottom:10px;">📍 <span id="modal-loc-text-span"></span> <span style="color:#ef4444; cursor:pointer; margin-left:5px;" onclick="window.removeLocation(true)">✖</span></div>
                    
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid #f1f5f9; padding-top:15px; padding-bottom:15px; position: sticky; bottom: -25px; background: inherit; z-index: 10;">
                        <div class="action-icons">
                            <label for="modal-image-input" class="icon-btn" title="Medya">🖼️</label>
                            <label onclick="window.addLocation(true)" class="icon-btn" title="Konum">📍</label>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <span class="char-counter" id="modal-char-count" style="margin-right: 15px;">1000</span>
                            <button class="share-btn" id="modal-share-btn" style="padding: 8px 20px;">Yayınla</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<div class="modal-overlay" id="edit-post-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size:16px;">İçeriği Düzenle</h3>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button style="padding:8px 20px; border:none; background:#f1f5f9; border-radius:6px; font-weight:600; cursor:pointer; color:#334155;" onclick="document.getElementById('edit-post-modal').style.display='none'">İptal</button>
                <button id="save-edited-post-btn" style="padding:8px 20px; border:none; background:#2c3e50; color:white; border-radius:6px; font-weight:600; cursor:pointer;">Güncelle</button>

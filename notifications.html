<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bildirimler / Mozaik</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    
    <!-- TAILWIND CSS & DARK MODE AYARI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '.dark-mode'],
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=31">
    
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Eski Tasarım Kalıntılarını Gizle */
        .mobile-sidebar, .mobile-sidebar-overlay, .app-container { display: none !important; }
        body { background-color: #f8fafc !important; color: #1e293b !important; }
        body.dark-mode { background-color: #0b1121 !important; color: #e5e7eb !important; }
    </style>
</head>
<body class="font-sans min-h-screen pb-24 text-slate-800 dark:text-gray-200 transition-colors duration-300">
    <script>
        try {
            if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');
        } catch(e) { console.warn("Gizli mod veya erişim engeli nedeniyle tema okunamadı."); }
    </script>

    <!-- ÜST MENÜ (Sadece masaüstü) -->
    <header class="hidden lg:block sticky top-0 z-50 bg-white/90 dark:bg-[#0b1121]/90 backdrop-blur-md border-b border-slate-200 dark:border-gray-800 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 text-2xl font-bold text-slate-900 dark:text-white tracking-wide cursor-pointer" onclick="window.location.href='feed.html'">
                <span>M</span>
                <div class="flex grid grid-cols-2 gap-0.5">
                    <div class="w-2 h-2 bg-pink-500 rounded-sm"></div>
                    <div class="w-2 h-2 bg-blue-500 rounded-sm"></div>
                    <div class="w-2 h-2 bg-cyan-400 rounded-sm"></div>
                    <div class="w-2 h-2 bg-purple-500 rounded-sm"></div>
                </div>
                <span>zaik</span>
            </div>
            <nav class="flex space-x-8 text-sm font-medium">
                <a href="feed.html" class="text-slate-500 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white transition">Ana Akış</a>
                <a href="search.html" class="text-slate-500 dark:text-gray-400 hover:text-slate-900 dark:hover:text-white transition">Keşfet</a>
                <a href="notifications.html" class="text-cyan-600 dark:text-cyan-400 border-b-2 border-cyan-500 dark:border-cyan-400 pb-5 pt-5 transition">Bildirimler</a>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-4 flex flex-col lg:flex-row gap-8">
        
        <!-- SOL SÜTUN (Bildirimler Listesi) -->
        <div class="flex-1 min-w-0">
            <!-- MOBİL ÜST BAR -->
            <div class="sticky top-0 z-40 bg-white/95 dark:bg-[#0b1121]/95 backdrop-blur-md pb-4 pt-2 transition-colors duration-300">
                <div class="flex lg:hidden justify-between items-center mb-4">
                    <div id="mobile-avatar-header" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 flex items-center justify-center text-lg overflow-hidden cursor-pointer" onclick="window.goToMyProfile()">👤</div>
                    <div class="flex gap-4 text-xl text-slate-500 dark:text-gray-400">
                        <i class="fa-solid fa-magnifying-glass cursor-pointer hover:text-cyan-500 dark:hover:text-white transition" onclick="window.location.href='search.html'"></i>
                        <i class="fa-regular fa-comment-dots cursor-pointer hover:text-cyan-500 dark:hover:text-white transition" onclick="window.location.href='chat.html'"></i>
                    </div>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-4 tracking-wide">Bildirimler</h2>
                
                <!-- BİLDİRİM SEKMELERİ -->
                <div class="flex border-b border-slate-200 dark:border-gray-800 text-sm font-semibold transition-colors duration-300">
                    <div class="flex-1 pb-3 text-center cursor-pointer text-cyan-600 dark:text-cyan-400 border-b-2 border-cyan-500 dark:border-cyan-400 transition" id="tab-all">Tümü</div>
                    <div class="flex-1 pb-3 text-center cursor-pointer text-slate-500 dark:text-gray-500 hover:text-slate-800 dark:hover:text-white transition border-b-2 border-transparent" id="tab-requests">Bağlantı İstekleri</div>
                </div>
            </div>

            <!-- Bildirim İçerik Alanı -->
            <div id="notifications-list" class="mt-4 space-y-3 pb-8">
                <div style="padding: 40px; text-align: center;" class="text-slate-500 dark:text-gray-400">Yükleniyor...</div>
            </div>
        </div>

        <!-- SAĞ SÜTUN (Öneriler Widget) -->
        <aside class="hidden lg:block w-80 flex-shrink-0 mt-20">
            <div class="bg-white dark:bg-[#151e32] border border-slate-200 dark:border-gray-800 rounded-2xl p-5 sticky top-24 shadow-sm dark:shadow-none transition-colors duration-300">
                <div class="flex items-center gap-2 mb-4 border-b border-slate-100 dark:border-gray-800 pb-3">
                    <i class="fa-solid fa-user-plus text-cyan-500 dark:text-cyan-400"></i>
                    <span class="font-bold text-sm text-slate-900 dark:text-white">Ağınıza Ekleyin</span>
                </div>
                <div id="who-to-follow-list" class="space-y-2">
                    <div class="text-sm text-slate-500 dark:text-gray-400 text-center py-4">Öneriler yükleniyor...</div>
                </div>
            </div>
        </aside>

    </main>

    <!-- POST DETAIL MODAL (Destek Talebi İnceleme İçin) -->
    <div id="ticket-modal" class="modal-overlay" style="display:none; z-index: 5000;" onclick="if(event.target === this) document.getElementById('ticket-modal').style.display='none'">
        <div class="modal-content bg-white dark:bg-[#151e32] border border-slate-200 dark:border-gray-700" style="max-width: 600px; width: 95%; display: flex; flex-direction: column; overflow: hidden; padding:0;">
            <div class="modal-header bg-white dark:bg-[#151e32] border-b border-slate-200 dark:border-gray-700" style="position: sticky; top:0; z-index: 10; padding: 15px 20px;">
                <h3 style="margin: 0; font-size: 16px;" class="text-slate-900 dark:text-white">Destek Talebi Detayı</h3>
                <span class="close-modal text-slate-400 hover:text-slate-700 dark:text-gray-400 dark:hover:text-white cursor-pointer text-2xl" onclick="document.getElementById('ticket-modal').style.display='none'">&times;</span>
            </div>
            <div id="ticket-modal-content" class="p-5 text-slate-700 dark:text-gray-300">Yükleniyor...</div>
        </div>
    </div>

    <!-- MOBİL ALT NAVİGASYON -->
    <div class="fixed bottom-0 w-full backdrop-blur-md border-t border-slate-200 dark:border-gray-800 lg:hidden bg-white/95 dark:bg-[#0b1121]/95 z-50 transition-colors duration-300">
        <div class="flex justify-around items-center h-16 relative">
            <a href="feed.html" class="flex flex-col items-center text-slate-400 dark:text-gray-400 hover:text-cyan-500 dark:hover:text-white transition"><i class="fa-solid fa-house text-lg"></i></a>
            <a href="search.html" class="flex flex-col items-center text-slate-400 dark:text-gray-400 hover:text-cyan-500 dark:hover:text-white transition"><i class="fa-solid fa-magnifying-glass text-lg"></i></a>
            
            <div class="relative -top-5">
                <div class="w-14 h-14 bg-gradient-to-tr from-cyan-400 to-blue-500 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30 cursor-pointer transform rotate-45 hover:scale-105 transition" onclick="window.location.href='feed.html?action=post'">
                    <i class="fa-solid fa-plus text-white text-2xl -rotate-45"></i>
                </div>
            </div>
            
            <!-- Bildirimler Aktif -->
            <a href="notifications.html" class="flex flex-col items-center text-cyan-600 dark:text-cyan-400"><i class="fa-solid fa-bell text-lg"></i></a>
            <a href="#" onclick="window.goToMyProfile()" class="flex flex-col items-center text-slate-400 dark:text-gray-400 hover:text-cyan-500 dark:hover:text-white transition"><i class="fa-regular fa-user text-lg"></i></a>
        </div>
    </div>
    
    <!-- Sistem Modalları (Karanlık/Aydınlık uyumlu) -->
    <div class="modal-overlay" id="users-list-modal"><div class="modal-content bg-white dark:bg-[#151e32]" style="padding:0;"><div class="modal-header border-slate-200 dark:border-gray-700 bg-white dark:bg-[#151e32]" style="padding: 20px; margin:0;"><h3 id="users-list-title" style="margin:0; font-size:16px;" class="text-slate-900 dark:text-white">Liste</h3><button class="close-btn" id="close-list-btn" style="background:transparent;">&times;</button></div><div id="users-list-container" style="max-height:400px; overflow-y:auto; padding: 10px;"></div></div></div>
    <div class="modal-overlay" id="support-modal"><div class="modal-content bg-white dark:bg-[#151e32]" style="padding:0;"><div class="modal-header border-slate-200 dark:border-gray-700 bg-white dark:bg-[#151e32]" style="padding: 20px; margin:0;"><h3 style="margin:0; font-size:16px;" class="text-slate-900 dark:text-white">Destek ve Şikayet</h3><button class="close-btn" onclick="document.getElementById('support-modal').style.display='none'" style="background:transparent;">&times;</button></div><div style="padding: 20px;"><p style="font-size: 14px; margin-bottom: 15px;" class="text-slate-500 dark:text-gray-400">Karşılaştığınız sorunu veya önerinizi detaylıca yazın.</p><textarea id="support-message-input" class="modal-input bg-slate-50 dark:bg-[#1e293b] border-slate-200 dark:border-gray-700 text-slate-900 dark:text-white" style="height:120px; resize:none;" placeholder="Mesajınız..."></textarea><button id="send-support-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 rounded-full mt-4 transition shadow-sm" onclick="window.sendSupportMessage()">Gönder</button></div></div></div>

    <script src="ui.js?v=29"></script>
    <script type="module" src="notifications.js"></script>

</body>
</html>
